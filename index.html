<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر نوبت‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="meta-theme" content="#15110c">
<script>try{var __t=localStorage.getItem("arman_cut_theme");if(__t)document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARMAN CUT">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#15110c;
    --bg-2:#1b1611;
    --surface:#221b14;
    --surface-2:#2b2216;
    --border:#3a2f21;
    --gold:#c9a25c;
    --gold-dim:#8f7643;
    --gold-glow:rgba(201,162,92,0.16);
    --rust:#9a5240;
    --text:#f3ead9;
    --text-dim:#a89478;
    --text-faint:#6f6250;
    --sage:#7f9a72;
    --danger:#b3563f;
    --radius-card:14px;
    --radius-sheet:22px;
    --on-accent:#1c1610;
    --accent-shadow:rgba(201,162,92,.35);
    --backdrop:rgba(10,8,6,.6);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="redwhite"]{color-scheme:light;
    --bg:#fbf6f4; --bg-2:#ffffff; --surface:#f5ecea; --surface-2:#ffffff; --border:#e8d9d5;
    --gold:#d62839; --gold-dim:#e58a93; --gold-glow:rgba(214,40,57,.10); --rust:#b3563f;
    --text:#2b1b1b; --text-dim:#7a6462; --text-faint:#b09c99; --sage:#2f8f55; --danger:#9b1c1c;
    --on-accent:#ffffff; --accent-shadow:rgba(214,40,57,.35); --backdrop:rgba(40,20,20,.35);}
  html[data-theme="emerald"]{color-scheme:dark;
    --bg:#0b1512; --bg-2:#101d19; --surface:#15251f; --surface-2:#1b2f27; --border:#26413a;
    --gold:#34d399; --gold-dim:#1f8f68; --gold-glow:rgba(52,211,153,.14); --rust:#d08a4e;
    --text:#e8f5f0; --text-dim:#8fb3a7; --text-faint:#587468; --sage:#7fd1a0; --danger:#e0584f;
    --on-accent:#06261b; --accent-shadow:rgba(52,211,153,.30); --backdrop:rgba(2,10,8,.65);}
  html[data-theme="navy"]{color-scheme:dark;
    --bg:#0c1220; --bg-2:#111a2e; --surface:#172238; --surface-2:#1e2b47; --border:#2a3a5c;
    --gold:#ff8a3d; --gold-dim:#b3622b; --gold-glow:rgba(255,138,61,.14); --rust:#d9674a;
    --text:#eef2fb; --text-dim:#8fa0c4; --text-faint:#5a6a8c; --sage:#6fcf97; --danger:#e5534b;
    --on-accent:#2a1300; --accent-shadow:rgba(255,138,61,.32); --backdrop:rgba(4,8,18,.65);}
  html[data-theme="bluewhite"]{color-scheme:light;
    --bg:#f4f7fc; --bg-2:#ffffff; --surface:#eaf0fa; --surface-2:#ffffff; --border:#d5dff0;
    --gold:#2563eb; --gold-dim:#7fa2ee; --gold-glow:rgba(37,99,235,.10); --rust:#c2603f;
    --text:#14213d; --text-dim:#5c6b8a; --text-faint:#9aa7c2; --sage:#2a8f62; --danger:#d64545;
    --on-accent:#ffffff; --accent-shadow:rgba(37,99,235,.35); --backdrop:rgba(15,25,50,.35);}
  html[data-theme="violet"]{color-scheme:dark;
    --bg:#130f1f; --bg-2:#1a1428; --surface:#221a33; --surface-2:#2b2140; --border:#3b2d57;
    --gold:#c084fc; --gold-dim:#7e57b0; --gold-glow:rgba(192,132,252,.15); --rust:#e08aa8;
    --text:#f3ecfb; --text-dim:#a898c4; --text-faint:#6e5f8c; --sage:#7fd1a0; --danger:#f0647a;
    --on-accent:#230b3a; --accent-shadow:rgba(192,132,252,.32); --backdrop:rgba(8,4,16,.65);}
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); overflow:hidden;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(600px 300px at 50% -60px, var(--gold-glow), transparent 70%),
      var(--bg);
    color:var(--text);
    height:100vh; height:100dvh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:460px;
    height:100vh; height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:linear-gradient(180deg, transparent 0%, var(--bg) 220px);
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    flex:none;
    z-index:5;
    padding:28px 22px 14px;
  }
  .menu-btn{
    position:absolute;
    top:26px; right:20px;
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    cursor:pointer;
    z-index:2;
    transition:transform .15s, background .15s;
  }
  .menu-btn:active{transform:scale(.9); background:var(--surface-2);}
  .menu-btn svg{width:18px;height:18px;}
  .menu-dropdown{
    position:absolute;
    top:68px; right:20px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px;
    min-width:170px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    z-index:15;
    display:none;
    flex-direction:column;
    gap:2px;
  }
  .menu-dropdown.show{display:flex;}
  .menu-item{
    display:flex; align-items:center; gap:10px;
    background:transparent;
    border:none;
    color:var(--text);
    padding:11px 12px;
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
    text-align:right;
    width:100%;
  }
  .menu-item:active{background:var(--surface);}
  .menu-item svg{width:16px;height:16px; color:var(--gold); flex-shrink:0;}
  .brand-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .brand-name{
    font-size:21px;
    font-weight:800;
    letter-spacing:1.8px;
  }
  .brand-name .b1{color:var(--text);}
  .brand-name .b2{color:var(--gold);}
  .header-sub{
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .header-sub #today-weekday{color:var(--gold); font-weight:600;}
  .header-sub .dot-sep{
    width:3px;height:3px;
    border-radius:50%;
    background:var(--text-faint);
  }

  /* ---------- Main content ---------- */
  main{
    flex:1;
    min-height:0;
    padding:10px 18px calc(140px + var(--safe-bottom));
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 118px), transparent calc(100% - 76px));
    mask-image:linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 118px), transparent calc(100% - 76px));
  }
  .view{display:none;}
  .view.active{display:block; animation:viewIn .28s ease both;}
  @keyframes viewIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* Section label */
  .count-label{
    font-size:13px;
    color:var(--text-dim);
    text-align:center;
    margin:18px 4px 4px;
  }

  /* ---------- Appointment card ---------- */
  .appt-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:14px 16px;
    margin-bottom:10px;
    position:relative;
    cursor:pointer;
    animation:cardIn .35s ease both;
    transition:background .15s;
  }
  .appt-card:active{background:var(--surface-2);}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .appt-time{
    font-size:17px;
    font-weight:700;
    color:var(--gold);
    min-width:52px;
    text-align:center;
    line-height:1.25;
    border-left:1px solid var(--border);
    padding-left:14px;
  }
  .appt-info{flex:1; min-width:0;}
  .appt-name{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .appt-name .name-text{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .status-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s;
  }
  .status-btn:active{transform:scale(.85);}
  .status-btn svg{width:17px;height:17px;}
  .status-ok{background:rgba(127,154,114,.2); color:var(--sage);}
  .status-bad{background:rgba(179,86,63,.2); color:var(--danger); margin-inline-start:5px;}
  @keyframes colorGreenIn{ from{color:var(--text);} to{color:var(--sage);} }
  @keyframes colorRedIn{ from{color:var(--text);} to{color:var(--danger);} }
  .appt-time.resolved-ok{color:var(--sage);}
  .appt-time.resolved-bad{color:var(--danger);}
  .appt-time.flash-in.resolved-ok{animation:colorGreenIn .6s ease-out;}
  .appt-time.flash-in.resolved-bad{animation:colorRedIn .6s ease-out;}
  .appt-name.past .name-text{
    color:var(--text-faint);
    font-weight:500;
  }
  .appt-phone{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:3px;
    direction:ltr;
    text-align:right;
  }
  .appt-note{
    font-size:11px;
    color:var(--text-faint);
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sheet-close{
    position:absolute;
    top:14px; left:16px;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .sheet-close svg{width:14px;height:14px;}
  .delete-btn{
    width:100%;
    background:transparent;
    border:none;
    color:var(--danger);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:16px 0 2px;
    text-align:center;
    cursor:pointer;
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;
    padding:56px 20px 20px;
    color:var(--text-dim);
  }
  .empty-state svg{width:52px;height:52px; color:var(--text-faint); margin-bottom:14px;}
  .empty-state p{font-size:14.5px; line-height:1.9;}

  /* ---------- Calendar ---------- */
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:8px 2px 16px;
  }
  .cal-title{font-size:16px; font-weight:700; color:var(--text);}
  .cal-nav{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .cal-nav:active{transform:scale(.88); background:var(--surface-2);}
  .cal-nav svg{width:16px;height:16px;}
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    row-gap:4px;
  }
  .cal-day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13.5px;
    color:var(--text);
    border-radius:50%;
    cursor:pointer;
    transition:background .18s, color .18s;
  }
  .cal-day.empty{cursor:default;}
  .cal-day .dot{
    position:absolute;
    bottom:4px;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--sage);
  }
  .cal-day.friday{color:var(--danger);}
  .cal-day.today{color:var(--gold); font-weight:700;}
  .cal-day.selected{
    background:var(--gold);
    color:var(--on-accent);
    font-weight:700;
  }
  .cal-day.selected .dot{background:var(--on-accent);}

  .selected-date-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 2px 12px;
  }
  .selected-date-row h2{font-size:15px; font-weight:600; color:var(--text);}
  .cal-weekdays .holiday{color:var(--danger);}

  /* ---------- Tab bar ---------- */
  .tabbar-wrap{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:460px;
    padding:0 18px calc(18px + var(--safe-bottom));
    display:flex;
    justify-content:center;
    pointer-events:none;
  }
  .tabbar{
    pointer-events:auto;
    position:relative;
    width:100%;
    max-width:320px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .tabbar .pill{
    position:absolute;
    top:5px; bottom:5px;
    left:5px;
    width:60px;
    background:var(--gold);
    border-radius:999px;
    transition:left .28s cubic-bezier(.65,0,.35,1), width .28s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .tab-btn{
    flex:1;
    z-index:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
    border-radius:999px;
    transition:color .2s, opacity .15s;
  }
  .tab-btn.active{color:var(--on-accent);}
  .tab-btn:active{opacity:.7;}
  .tab-add{
    flex:0 0 auto;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--gold);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    position:relative;
    z-index:2;
    box-shadow:0 4px 14px var(--accent-shadow);
    transition:transform .15s;
  }
  .tab-add:active{transform:scale(.88);}
  .tab-add svg{width:20px;height:20px; color:var(--on-accent);}


  /* ---------- Sheet / modal ---------- */
  .backdrop{
    position:fixed; inset:0;
    background:var(--backdrop);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:10;
  }
  .backdrop.show{opacity:1; pointer-events:auto;}

  .sheet{
    position:fixed;
    left:50%; bottom:0;
    transform:translate(-50%, 100%);
    width:100%; max-width:460px;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    padding:10px 22px calc(26px + var(--safe-bottom));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:11;
    max-height:94vh; max-height:94dvh;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .sheet.show{transform:translate(-50%, 0);}
  .sheet-handle{
    width:38px; height:4px;
    background:var(--border);
    border-radius:99px;
    margin:4px auto 12px;
  }
  .sheet h3{font-size:17px; font-weight:700; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    outline:none;
  }
  .field textarea{resize:none; font-family:inherit;}
  .field input:focus, .field textarea:focus{border-color:var(--gold-dim);}
  .field input[type="tel"]{direction:ltr; text-align:right;}
  .companion-toggle{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:999px;
    padding:8px 14px;
    font-family:inherit;
    font-size:12.5px;
    cursor:pointer;
    width:fit-content;
    margin:-8px 0 16px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .companion-toggle svg{width:14px;height:14px;}
  .companion-toggle.active{background:var(--gold-glow); border-color:var(--gold-dim); color:var(--gold);}
  .status-toggle{display:flex; gap:8px;}
  .status-opt{
    flex:1;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .status-opt.active{background:var(--gold); color:var(--on-accent); border-color:var(--gold);}
  .row3, .row2{
    display:grid;
    gap:8px;
  }
  .row3{grid-template-columns:1.3fr 1fr 1fr;}
  .row2{grid-template-columns:1fr 1fr;}
  select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 8px;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    outline:none;
    text-align:center;
    appearance:none;
    -webkit-appearance:none;
  }
  select:focus{border-color:var(--gold-dim);}
  .submit-btn{
    width:100%;
    background:var(--gold);
    color:var(--on-accent);
    border:none;
    border-radius:999px;
    padding:15px 0;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    margin-top:8px;
    cursor:pointer;
  }
  .submit-btn:active{opacity:.85;}
  .error-msg{
    font-size:12.5px;
    color:var(--danger);
    margin-top:-8px;
    margin-bottom:14px;
    display:none;
  }
  .error-msg.show{display:block;}

  /* ---------- Confirm delete modal ---------- */
  .confirm-box{
    position:fixed;
    left:50%; top:50%;
    transform:translate(-50%,-50%) scale(.9);
    width:calc(100% - 60px);
    max-width:320px;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 20px;
    z-index:21;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .confirm-box.show{opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto;}
  .confirm-box p{font-size:14px; line-height:1.8; margin-bottom:18px; color:var(--text);}
  .confirm-box .btn-row{display:flex; gap:10px;}
  .confirm-box button{
    flex:1;
    border:none;
    border-radius:999px;
    padding:11px 0;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel{background:var(--surface); color:var(--text-dim); border:1px solid var(--border) !important;}
  .btn-danger{background:var(--danger); color:#fff;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    top:18px; left:50%;
    transform:translate(-50%,-40px);
    background:var(--surface-2);
    border:1px solid var(--gold-dim);
    color:var(--text);
    padding:12px 20px;
    border-radius:999px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    transition:transform .3s cubic-bezier(.32,.72,0,1), opacity .3s;
    z-index:30;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    white-space:nowrap;
  }
  .toast.show{transform:translate(-50%,0); opacity:1;}
  .toast svg{width:16px;height:16px; color:var(--sage); flex-shrink:0;}
  .sync-dot{position:absolute; top:-2px; left:-2px; width:10px; height:10px; border-radius:50%; background:var(--text-dim); border:2px solid var(--bg); display:none;}
  .sync-dot.s-synced{display:block; background:#7fb08a;}
  .sync-dot.s-pending,.sync-dot.s-syncing{display:block; background:var(--gold);}

<script>
/* ============ Jalali calendar conversion ============ */
function gregorianToJalali(gy, gm, gd) {
  var g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  var jy;
  if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + (parseInt((gy2 + 3) / 4)) - (parseInt((gy2 + 99) / 100)) + (parseInt((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * parseInt(days / 12053);
  days %= 12053;
  jy += 4 * parseInt(days / 1461);
  days %= 1461;
  if (days > 365) { jy += parseInt((days - 1) / 365); days = (days - 1) % 365; }
  var jm, jd;
  if (days < 186) { jm = 1 + parseInt(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + parseInt((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd) {
  var gy;
  if (jy > 979) { gy = 1600; jy -= 979; } else { gy = 621; }
  var days = (365 * jy) + (parseInt(jy / 33) * 8) + parseInt(((jy % 33) + 3) / 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * parseInt(days / 146097);
  days %= 146097;
  var leapAdjust = false;
  if (days > 36524) {
    days -= 1;
    gy += 100 * parseInt(days / 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * parseInt(days / 1461);
  days %= 1461;
  if (days > 365) { gy += parseInt((days - 1) / 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var gm;
  for (gm = 0; gm < 13; gm++) {
    var v = sal_a[gm];
    if (gd <= v) break;
    gd -= v;
  }
  return [gy, gm, gd];
}
function isLeapJalali(jy) {
  var breaks = [1,5,9,13,17,22,26,30];
  return breaks.indexOf(((jy % 33) + 33) % 33) >= 0;
}
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalali(jy) ? 30 : 29;
}
const MONTH_NAMES = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAY_FULL = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه']; // index = JS getDay()
function toFa(n){ return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }

/* ============ State ============ */
const now = new Date();
const [TODAY_JY, TODAY_JM, TODAY_JD] = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());

let appointments = [];
let activeTab = 'today';
let calViewYear = TODAY_JY;
let calViewMonth = TODAY_JM;
let selectedDate = { jy: TODAY_JY, jm: TODAY_JM, jd: TODAY_JD };
let sheetContextDate = { jy: TODAY_JY, jm: TODAY_JM, jd: TODAY_JD };

/* ============ Data loading (local device storage) ============ */
const STORAGE_KEY = 'arman_cut_appointments';

function loadAppointments(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    appointments = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(appointments)) appointments = [];
  }catch(e){
    appointments = [];
  }
  renderToday();
  renderCalendar();
}
function persistAppointments(){
  try{ if(sync) sync.noteLocalChange(); }catch(e){}
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
    return true;
  }catch(e){
    showToast('حافظه گوشی پر شده، امکان ذخیره نیست');
    return false;
  }
}

/* ============ Header date ============ */
function renderHeader(){
  document.getElementById('today-weekday').textContent = 'امروز، ' + WEEKDAY_FULL[now.getDay()];
  document.getElementById('today-full-date').textContent =
    toFa(TODAY_JD) + ' ' + MONTH_NAMES[TODAY_JM-1] + ' ' + toFa(TODAY_JY);
}

/* ============ Today view ============ */
function apptSortKey(a){ return a.hour*60 + a.minute; }

function apptDateObj(a){
  const [gy, gm, gd] = jalaliToGregorian(a.jy, a.jm, a.jd);
  return new Date(gy, gm-1, gd, a.hour, a.minute);
}
function isPastAppt(a){
  return apptDateObj(a).getTime() < now.getTime();
}
let justResolvedId = null;
let justResolvedType = null; // 'ok' | 'bad'

function countLabelText(list, dayLabel){
  const done = list.filter(a => a.status === 'done').length;
  const noshow = list.filter(a => a.status === 'noshow').length;
  let text = toFa(list.length) + ' نوبت برای ' + dayLabel;
  if(done || noshow){
    text += ` (${toFa(done)} ✓ ، ${toFa(noshow)} ✗)`;
  }
  return text;
}

let didAutoScroll = false;
function autoScrollToUpcoming(){
  if(didAutoScroll) return;
  didAutoScroll = true;
  const list = appointments
    .filter(a => a.jy===TODAY_JY && a.jm===TODAY_JM && a.jd===TODAY_JD)
    .sort((a,b)=>apptSortKey(a)-apptSortKey(b));
  const upcoming = list.find(a => !isPastAppt(a));
  if(!upcoming) return;
  const card = document.querySelector(`.appt-card[data-appt-id="${upcoming.id}"]`);
  if(card) card.scrollIntoView({ block: 'center', behavior: 'auto' });
}

function renderToday(){
  const list = appointments
    .filter(a => a.jy===TODAY_JY && a.jm===TODAY_JM && a.jd===TODAY_JD)
    .sort((a,b)=>apptSortKey(a)-apptSortKey(b));

  const countEl = document.getElementById('today-count');
  const listEl = document.getElementById('today-list');
  listEl.innerHTML = '';

  if(list.length===0){
    countEl.textContent = '';
    listEl.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/></svg>
        <p>هنوز نوبتی برای امروز ثبت نکردی.<br>با دکمه پایین صفحه یه نوبت جدید اضافه کن.</p>
      </div>`;
    return;
  }
  countEl.textContent = countLabelText(list, 'امروز');
  list.forEach(a => listEl.appendChild(buildApptCard(a)));
}

function buildApptCard(a){
  const div = document.createElement('div');
  const past = isPastAppt(a);
  div.className = 'appt-card';
  div.dataset.apptId = a.id;
  const hasName = a.name && a.name.trim();
  const hasPhone = a.phone && a.phone.trim();
  const displayName = hasName ? a.name : (hasPhone ? a.phone : '');
  const showPhoneLine = hasName && hasPhone;
  const nameDirAttr = !hasName && hasPhone ? ' dir="ltr" style="text-align:right;"' : '';

  let controlHtml = '';
  let nameExtraClass = '';
  let timeExtraClass = '';
  if(past){
    if(a.status === 'done'){
      nameExtraClass = ' past';
      timeExtraClass = ' resolved-ok';
    } else if(a.status === 'noshow'){
      nameExtraClass = ' past';
      timeExtraClass = ' resolved-bad';
    } else {
      controlHtml = `
        <button class="status-btn status-ok" aria-label="اوکی">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="status-btn status-bad" aria-label="نیومد">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>`;
    }
  }

  const flashClass = justResolvedId === a.id ? ' flash-in' : '';
  const nameClass = 'appt-name' + nameExtraClass;
  const timeClass = 'appt-time' + timeExtraClass + flashClass;
  const hasNote = a.note && a.note.trim();

  div.innerHTML = `
    <div class="${timeClass}">${toFa(pad2(a.hour))}<br>${toFa(pad2(a.minute))}</div>
    <div class="appt-info">
      <div class="${nameClass}"${nameDirAttr}><span class="name-text">${escapeHtml(displayName)}</span>${controlHtml}</div>
      ${showPhoneLine ? `<div class="appt-phone">${escapeHtml(a.phone)}</div>` : ''}
      ${hasNote ? `<div class="appt-note">${escapeHtml(a.note)}</div>` : ''}
    </div>`;

  div.addEventListener('click', () => openEditSheet(a));
  const okBtn = div.querySelector('.status-ok');
  const badBtn = div.querySelector('.status-bad');
  if(okBtn) okBtn.addEventListener('click', (e) => { e.stopPropagation(); setApptStatus(a.id, 'done'); });
  if(badBtn) badBtn.addEventListener('click', (e) => { e.stopPropagation(); setApptStatus(a.id, 'noshow'); });
  return div;
}

function setApptStatus(id, status){
  const appt = appointments.find(x => x.id === id);
  if(!appt) return;
  appt.status = status;
  persistAppointments();
  justResolvedId = id;
  justResolvedType = status === 'done' ? 'ok' : 'bad';
  renderToday();
  renderCalendar();
  justResolvedId = null;
  justResolvedType = null;
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============ Calendar view ============ */
function renderCalendar(){
  document.getElementById('cal-title').textContent = MONTH_NAMES[calViewMonth-1] + ' ' + toFa(calViewYear);

  const [gy,gm,gd] = jalaliToGregorian(calViewYear, calViewMonth, 1);
  const firstWeekdayJs = new Date(gy, gm-1, gd).getDay(); // 0=Sun
  const leadingEmpty = (firstWeekdayJs + 1) % 7; // Sat-first index
  const monthLen = jalaliMonthLength(calViewYear, calViewMonth);

  const apptDaySet = new Set(
    appointments
      .filter(a => a.jy===calViewYear && a.jm===calViewMonth)
      .map(a => a.jd)
  );

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  for(let i=0;i<leadingEmpty;i++){
    const cell = document.createElement('div');
    cell.className = 'cal-day empty';
    grid.appendChild(cell);
  }
  for(let d=1; d<=monthLen; d++){
    const cell = document.createElement('div');
    let cls = 'cal-day';
    const col = (leadingEmpty + (d-1)) % 7;
    if(col===6) cls += ' friday';
    if(calViewYear===TODAY_JY && calViewMonth===TODAY_JM && d===TODAY_JD) cls += ' today';
    if(calViewYear===selectedDate.jy && calViewMonth===selectedDate.jm && d===selectedDate.jd) cls += ' selected';
    cell.className = cls;
    cell.textContent = toFa(d);
    if(apptDaySet.has(d)){
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    cell.addEventListener('click', () => {
      selectedDate = { jy: calViewYear, jm: calViewMonth, jd: d };
      renderCalendar();
      renderDayList();
    });
    grid.appendChild(cell);
  }
  renderDayList();
}

function renderDayList(){
  const label = document.getElementById('selected-date-label');
  const isToday = selectedDate.jy===TODAY_JY && selectedDate.jm===TODAY_JM && selectedDate.jd===TODAY_JD;
  label.textContent = (isToday ? 'امروز، ' : '') + toFa(selectedDate.jd) + ' ' + MONTH_NAMES[selectedDate.jm-1] + ' ' + toFa(selectedDate.jy);

  const list = appointments
    .filter(a => a.jy===selectedDate.jy && a.jm===selectedDate.jm && a.jd===selectedDate.jd)
    .sort((a,b)=>apptSortKey(a)-apptSortKey(b));

  const listEl = document.getElementById('calendar-day-list');
  const countEl = document.getElementById('calendar-count');
  listEl.innerHTML = '';
  if(list.length===0){
    countEl.textContent = '';
    listEl.innerHTML = `<div class="empty-state" style="padding:24px 10px 4px;">
      <p>برای این روز نوبتی ثبت نشده</p>
    </div>`;
    return;
  }
  countEl.textContent = countLabelText(list, isToday ? 'امروز' : 'این روز');
  list.forEach(a => listEl.appendChild(buildApptCard(a)));
}

const backdrop = document.getElementById('backdrop');

// working-hour slots: 08:30–13:30 and 16:00–21:30, every 30 minutes, with a break in between
const MORNING_SLOTS = (() => {
  const slots = [];
  for(let m=8*60+30; m<=13*60+30; m+=30) slots.push(m);
  return slots;
})();
const EVENING_SLOTS = (() => {
  const slots = [];
  for(let m=16*60; m<=21*60+30; m+=30) slots.push(m);
  return slots;
})();

function populateSelects(){
  const selMonth = document.getElementById('sel-month');
  selMonth.innerHTML = MONTH_NAMES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');

  const selYear = document.getElementById('sel-year');
  const years = [TODAY_JY-1, TODAY_JY, TODAY_JY+1];
  selYear.innerHTML = years.map(y=>`<option value="${y}">${toFa(y)}</option>`).join('');

  document.getElementById('sel-month').addEventListener('change', () => { updateDayOptions(); updateTimeOptions(null, {skipPastFilter: !!editingId}); });
  document.getElementById('sel-year').addEventListener('change', () => { updateDayOptions(); updateTimeOptions(null, {skipPastFilter: !!editingId}); });
  document.getElementById('sel-day').addEventListener('change', () => { updateTimeOptions(null, {skipPastFilter: !!editingId}); });
}
function updateDayOptions(){
  const y = parseInt(document.getElementById('sel-year').value);
  const m = parseInt(document.getElementById('sel-month').value);
  const len = jalaliMonthLength(y, m);
  const selDay = document.getElementById('sel-day');
  const prevVal = parseInt(selDay.value) || 1;
  let opts = '';
  for(let d=1; d<=len; d++) opts += `<option value="${d}">${toFa(d)}</option>`;
  selDay.innerHTML = opts;
  selDay.value = Math.min(prevVal, len);
}

function updateTimeOptions(forceSlot, opts){
  opts = opts || {};
  const jy = parseInt(document.getElementById('sel-year').value);
  const jm = parseInt(document.getElementById('sel-month').value);
  const jd = parseInt(document.getElementById('sel-day').value);
  const isToday = jy===TODAY_JY && jm===TODAY_JM && jd===TODAY_JD;
  const nowMinutes = now.getHours()*60 + now.getMinutes();

  const takenSet = new Set(
    appointments
      .filter(a => a.id !== editingId && a.jy===jy && a.jm===jm && a.jd===jd)
      .map(a => a.hour*60 + a.minute)
  );

  const forceMin = forceSlot ? (forceSlot.hour*60 + forceSlot.minute) : null;

  function keep(m){
    if(m === forceMin) return true;
    if(takenSet.has(m)) return false;
    if(!opts.skipPastFilter && isToday && m < nowMinutes) return false;
    return true;
  }

  let morning = MORNING_SLOTS.filter(keep);
  let evening = EVENING_SLOTS.filter(keep);

  if(forceMin !== null && !morning.includes(forceMin) && !evening.includes(forceMin)){
    if(forceMin < 14*60){ morning = morning.concat([forceMin]).sort((a,b)=>a-b); }
    else{ evening = evening.concat([forceMin]).sort((a,b)=>a-b); }
  }

  const sel = document.getElementById('sel-time');
  if(morning.length===0 && evening.length===0){
    sel.innerHTML = `<option value="">زمانی باقی نمونده</option>`;
    return;
  }

  const optionHtml = (m) => {
    const h = Math.floor(m/60), mi = m%60;
    const val = h + ':' + mi;
    const label = toFa(pad2(h)) + ':' + toFa(pad2(mi));
    return `<option value="${val}">${label}</option>`;
  };

  let html = morning.map(optionHtml).join('');
  if(morning.length && evening.length) html += `<option disabled>— استراحت —</option>`;
  html += evening.map(optionHtml).join('');
  sel.innerHTML = html;

  if(forceMin !== null) sel.value = Math.floor(forceMin/60) + ':' + (forceMin%60);
}


let editingId = null;

function fillDateSelects(jy, jm, jd){

function parseSharedContact(text){
  text = (text || '').trim();
  const phoneMatch = text.match(/(\+?\d[\d\s\-]{7,}\d)/);
  let phone = '', name = text;
  if(phoneMatch){
    phone = phoneMatch[0].replace(/[\s\-]/g, '');
    name = (text.slice(0, phoneMatch.index) + ' ' + text.slice(phoneMatch.index + phoneMatch[0].length))
      .replace(/[,:؛;]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  return { name, phone };
}

document.getElementById('paste-btn').addEventListener('click', async () => {
  try{
    const text = await navigator.clipboard.readText();
    if(!text || !text.trim()){ showToast('کلیپ‌بورد خالیه'); return; }
    const parsed = parseSharedContact(text);
    const nameInput = document.getElementById('input-name');
    const phoneInput = document.getElementById('input-phone');
    if(parsed.phone && !phoneInput.value.trim()) phoneInput.value = parsed.phone;
    if(parsed.name && !nameInput.value.trim()) nameInput.value = parsed.name;
    showToast('از کلیپ‌بورد جای‌گذاری شد، بررسی کن');
  }catch(e){
    showToast('اجازه دسترسی به کلیپ‌بورد داده نشد');
  }
});

function checkSharedContact(){
  const params = new URLSearchParams(location.search);
  const sharedText = [params.get('shared_text'), params.get('shared_title')].filter(Boolean).join(' ').trim();
  if(!sharedText) return;
  history.replaceState({}, '', location.pathname);
  const parsed = parseSharedContact(sharedText);
  openAddSheet({ jy: TODAY_JY, jm: TODAY_JM, jd: TODAY_JD }, false);
  document.getElementById('input-name').value = parsed.name;
  document.getElementById('input-phone').value = parsed.phone;
  updateHistoryBtn();
  showToast('اطلاعات از اشتراک‌گذاری پر شد، بررسی کن');
}

/* ---- layers: every popup takes one history entry so Android Back closes it, not the app ---- */
const layers = [];
let histPos = 0, reconTimer = 0;
function layerOpen(name){
  if(layers.includes(name)) return;
  layers.push(name);
  try{ history.pushState({ d: layers.length }, ''); histPos++; }catch(e){}
}
function layerClose(name){
  const i = layers.lastIndexOf(name);
  if(i < 0) return;
  layers.splice(i, 1);
  if(reconTimer) return;
  reconTimer = setTimeout(() => {
    reconTimer = 0;
    const n = histPos - layers.length;
    if(n > 0){ histPos = layers.length; try{ history.go(-n); }catch(e){} }
  }, 0);
}
function closerFor(name){
  return { sheet: closeSheet, confirm: closeConfirm, login: closeLogin,
           settings: closeSettings, theme: closeTheme, history: closeHistory }[name];
}
window.addEventListener('popstate', (e) => {
  const d = (e.state && e.state.d) || 0;
  histPos = d;
  while(layers.length > d){
    const name = layers.pop();
    const fn = closerFor(name);
    if(fn) fn();
  }
});
try{ history.replaceState({ d: 0 }, ''); }catch(e){}
function closeTopLayer(){
  const name = layers[layers.length - 1];
  const fn = name && closerFor(name);
  if(fn) fn();
}
function syncBackdrop(){
  const ids = ['sheet','login-sheet','settings-sheet','theme-sheet','history-sheet','confirm-box'];
  const any = ids.some(id => document.getElementById(id).classList.contains('show'));
  backdrop.classList.toggle('show', any);
}

function openSheetUI(){
  sheet.classList.add('show');
  layerOpen('sheet');
  syncBackdrop();
}
function closeSheet(){
  sheet.classList.remove('show');
  syncBackdrop();
  layerClose('sheet');
}
backdrop.addEventListener('click', closeTopLayer);

document.getElementById('submit-appt').addEventListener('click', () => {
  const name = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  const note = document.getElementById('input-note').value.trim();
  const errEl = document.getElementById('form-error');
  const timeErrEl = document.getElementById('time-error');
  errEl.classList.remove('show');
  timeErrEl.classList.remove('show');

  if(!name && !phone){
    errEl.textContent = 'لطفاً نام یا شماره تماس رو وارد کن';
    errEl.classList.add('show');
    return;
  }

  const jy = parseInt(document.getElementById('sel-year').value);
  const jm = parseInt(document.getElementById('sel-month').value);
  const jd = parseInt(document.getElementById('sel-day').value);
  const timeVal = document.getElementById('sel-time').value;
  if(!timeVal){
    timeErrEl.textContent = 'برای این روز زمانی در دسترس نیست';
    timeErrEl.classList.add('show');
    return;
  }
  const [hour, minute] = timeVal.split(':').map(Number);

  const conflict = appointments.some(a =>
    a.id !== editingId && a.jy===jy && a.jm===jm && a.jd===jd && a.hour===hour && a.minute===minute
  );
  if(conflict){
    timeErrEl.textContent = 'این ساعت قبلاً برای یه نفر دیگه ثبت شده';
    timeErrEl.classList.add('show');
    document.getElementById('sel-time').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  if(editingId){
    const activeStatusBtn = document.querySelector('#status-field .status-opt.active');
    const status = activeStatusBtn ? activeStatusBtn.dataset.status : '';
    const appt = appointments.find(a => a.id === editingId);
    if(appt) Object.assign(appt, {name, phone, note, jy, jm, jd, hour, minute, status});
  } else {
    const companionOn = document.getElementById('companion-toggle').classList.contains('active');
    let secondSlot = null;
    if(companionOn){
      const secondMin = hour*60 + minute + 30;
      const inRange = MORNING_SLOTS.includes(secondMin) || EVENING_SLOTS.includes(secondMin);
      const secondTaken = appointments.some(a => a.jy===jy && a.jm===jm && a.jd===jd && (a.hour*60+a.minute)===secondMin);
      if(!inRange || secondTaken){
        timeErrEl.textContent = 'نوبت بعدی برای همراه در دسترس نیست؛ زمان دیگه‌ای انتخاب کن یا تیک همراه رو بردار';
        timeErrEl.classList.add('show');
        return;
      }
      secondSlot = { hour: Math.floor(secondMin/60), minute: secondMin%60 };
    }
    appointments.push({
      id: 'a' + Date.now() + Math.random().toString(36).slice(2,7),
      name, phone, note, jy, jm, jd, hour, minute
    });
    if(secondSlot){
      appointments.push({
        id: 'a' + Date.now() + Math.random().toString(36).slice(2,7),
        name, phone, note, jy, jm, jd, hour: secondSlot.hour, minute: secondSlot.minute
      });
    }
  }

  if(!persistAppointments()) return;

  closeSheet();
  renderToday();
  renderCalendar();
  showToast(editingId ? 'نوبت به‌روزرسانی شد' : 'نوبت ثبت شد');
});

/* ============ Toast ============ */
let toastTimer = null;
function showToast(text){
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);

/* ============ Reminder notifications (while the app is open) ============ */
const notifiedApptIds = new Set();

function requestNotificationPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function checkUpcomingReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  if(!('serviceWorker' in navigator)) return;
  const nowCheck = new Date();
  appointments.forEach(a => {
    if(notifiedApptIds.has(a.id)) return;
    const diffMin = (apptDateObj(a).getTime() - nowCheck.getTime()) / 60000;
    if(diffMin > 0 && diffMin <= 5){
      notifiedApptIds.add(a.id);
      const who = (a.name && a.name.trim()) ? a.name : ((a.phone && a.phone.trim()) ? a.phone : 'مشتری');
      const timeStr = toFa(pad2(a.hour)) + ':' + toFa(pad2(a.minute));
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification('یادآوری نوبت', {
          body: `۵ دقیقه تا شروع نوبت آقای ${who} در ساعت ${timeStr}`,
          icon: 'icon-192.png',
          badge: 'badge-96.png',
          tag: 'appt-' + a.id,
          dir: 'rtl',
          lang: 'fa'
        }).catch(()=>{});
      });
    }
  });
}

/* ============ Menu: backup / restore ============ */
document.getElementById('menu-btn').addEventListener('click', (e) => {

document.getElementById('menu-backup').addEventListener('click', async () => {
  document.getElementById('menu-dropdown').classList.remove('show');
  const data = JSON.stringify(appointments, null, 2);
  const filename = `arman-cut-backup-${TODAY_JY}-${pad2(TODAY_JM)}-${pad2(TODAY_JD)}.json`;

  if('showSaveFilePicker' in window){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      showToast('پشتیبان ذخیره شد');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
      // otherwise fall through to the download fallback below
    }
  }

  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('فایل پشتیبان دانلود شد');
});

document.getElementById('menu-restore').addEventListener('click', () => {
  document.getElementById('menu-dropdown').classList.remove('show');
  document.getElementById('restore-file-input').click();
});
document.getElementById('restore-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ showToast('فایل معتبر نیست'); return; }
    if(!Array.isArray(parsed)){ showToast('فایل معتبر نیست'); return; }
    const seenIds = new Set();
    parsed = parsed.filter(a => a && [a.jy,a.jm,a.jd,a.hour,a.minute].every(Number.isInteger)).map(a => {
      let id = a.id != null ? String(a.id) : '';
      if(!id || seenIds.has(id)) id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      seenIds.add(id);
      return { id, name: String(a.name||''), phone: String(a.phone||''), note: String(a.note||''),
        status: (a.status==='done'||a.status==='noshow') ? a.status : '',
        jy:a.jy, jm:a.jm, jd:a.jd, hour:a.hour, minute:a.minute, updatedAt: Number(a.updatedAt)||0 };
    });
    openConfirm(
      'بازیابی از این فایل، همه‌ی نوبت‌های فعلی رو جایگزین می‌کنه. مطمئنی؟',
      'بازیابی',
      () => {
        appointments = parsed;
        if(!persistAppointments()) return;
        showToast('بازیابی انجام شد');
        renderToday();
        renderCalendar();
      }
    );
  };
  reader.readAsText(file);
});

/* ============ Customer history ============ */
function normName(x){
  return String(x||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]+/g,' ').trim().toLowerCase();
}
function normPhone(x){
  return String(x||'').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
}
function customerAppts(){
  const n = normName(document.getElementById('input-name').value);
  const ph = normPhone(document.getElementById('input-phone').value);
  if(!n && ph.length < 7) return [];
  return appointments
    .filter(a => a.id !== editingId && ((n && normName(a.name) === n) || (ph.length >= 7 && normPhone(a.phone) === ph)))
    .sort((a,b) => apptDateObj(b) - apptDateObj(a));
}
function updateHistoryBtn(){
  const list = customerAppts();
  const btn = document.getElementById('hist-btn');
  btn.classList.toggle('show', list.length > 0);
  document.getElementById('hist-count').textContent = list.length ? toFa(list.length) : '';
}
document.getElementById('input-name').addEventListener('input', updateHistoryBtn);
document.getElementById('input-name').addEventListener('change', updateHistoryBtn);
document.getElementById('input-phone').addEventListener('input', updateHistoryBtn);

const historySheet = document.getElementById('history-sheet');
function openHistory(){
  const list = customerAppts();
  if(!list.length) return;
  const who = document.getElementById('input-name').value.trim() || list[0].name || list[0].phone;
  document.getElementById('history-title').textContent = 'سابقه مراجعات ' + who;
  const done = list.filter(a => a.status === 'done').length;
  const noshow = list.filter(a => a.status === 'noshow').length;
  document.getElementById('history-summary').textContent =
    `${toFa(list.length)} نوبت ثبت‌شده — ${toFa(done)} بار اومده، ${toFa(noshow)} بار نیومده`;
  document.getElementById('history-list').innerHTML = list.map(a => {
    const dow = WEEKDAY_FULL[apptDateObj(a).getDay()];
    let chip = '<span class="hist-chip">بدون وضعیت</span>';
    if(a.status === 'done') chip = '<span class="hist-chip ok">اومد</span>';
    else if(a.status === 'noshow') chip = '<span class="hist-chip bad">نیومد</span>';
    else if(!isPastAppt(a)) chip = '<span class="hist-chip future">نوبت آینده</span>';
    return `<div class="hist-row">
      <div class="hist-top"><div class="hist-date">${dow} ${toFa(a.jd)} ${MONTH_NAMES[a.jm-1]} ${toFa(a.jy)}</div>${chip}</div>
      <div class="hist-time">ساعت ${toFa(pad2(a.hour))}:${toFa(pad2(a.minute))}</div>
      ${a.note && a.note.trim() ? `<div class="hist-note">${escapeHtml(a.note)}</div>` : ''}
    </div>`;
  }).join('');
  historySheet.classList.add('show');
  layerOpen('history');
  syncBackdrop();
}
function closeHistory(){
  historySheet.classList.remove('show');
  syncBackdrop();
  layerClose('history');
}

const THEMES = [
  { id:'gold',      name:'طلایی و قهوه‌ای', bg:'#15110c', surface:'#2b2216', accent:'#c9a25c', text:'#f3ecd9' },
  { id:'redwhite',  name:'سفید و قرمز',      bg:'#fbf6f4', surface:'#f0e2de', accent:'#d62839', text:'#2b1b1b' },
  { id:'emerald',   name:'مشکی و زمردی',     bg:'#0b1512', surface:'#1b2f27', accent:'#34d399', text:'#e8f5f0' },
  { id:'navy',      name:'سرمه‌ای و نارنجی', bg:'#0c1220', surface:'#1e2b47', accent:'#ff8a3d', text:'#eef2fb' },
  { id:'bluewhite', name:'سفید و آبی',       bg:'#f4f7fc', surface:'#e1e9f7', accent:'#2563eb', text:'#14213d' },
  { id:'violet',    name:'بنفش و صورتی',     bg:'#130f1f', surface:'#2b2140', accent:'#c084fc', text:'#f3ecfb' }
];
let currentTheme = 'gold';
try{ const t = localStorage.getItem('arman_cut_theme'); if(THEMES.some(x => x.id === t)) currentTheme = t; }catch(e){}
function applyTheme(id, save){
  const th = THEMES.find(x => x.id === id) || THEMES[0];
  currentTheme = th.id;
  if(th.id === 'gold') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th.id);
  const light = th.id === 'redwhite' || th.id === 'bluewhite';
  document.getElementById('meta-theme').setAttribute('content', th.bg);
  const cs = document.querySelector('meta[name="color-scheme"]');
  if(cs) cs.setAttribute('content', light ? 'light' : 'dark');
  document.getElementById('set-theme-name').textContent = th.name;
  if(save){ try{ localStorage.setItem('arman_cut_theme', th.id); }catch(e){} }
  document.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.theme === th.id));
}
function buildThemeGrid(){
  document.getElementById('theme-grid').innerHTML = THEMES.map(t => `
    <button class="theme-card" data-theme="${t.id}">
      <div class="theme-prev" style="background:${t.bg}">
        <div class="r"><i style="background:${t.accent}"></i><i style="background:${t.surface}; flex:1"></i></div>
        <i style="background:${t.text}; opacity:.55; width:70%"></i>
        <i style="background:${t.surface}; width:45%"></i>
      </div>
      <div class="theme-name">${t.name}</div>
    </button>`).join('');
  document.querySelectorAll('.theme-card').forEach(c => c.addEventListener('click', () => {
    applyTheme(c.dataset.theme, true);
  }));
}

const STATUS_TEXT = {
  unconfigured:'آنلاین نشده (config.js پر نشده)', loggedout:'وارد حساب آنلاین نشدی', syncing:'در حال همگام‌سازی…',
  offline:'آفلاین — روی گوشی ذخیره شد', error:'مشکل در همگام‌سازی', pending:'منتظر ارسال به سرور',
  synced:'همگام است ✓', reauth:'نشست تمام شد؛ دوباره وارد شو'
};
function fmtAgo(ts){
  if(!ts) return '';
  const m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return 'همین الان';
  if(m < 60) return m.toLocaleString('fa-IR') + ' دقیقه پیش';
  const h = Math.round(m/60);
  if(h < 24) return h.toLocaleString('fa-IR') + ' ساعت پیش';
  return Math.round(h/24).toLocaleString('fa-IR') + ' روز پیش';
}
function renderSyncUI(st){
  if(!st) return;
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (st.configured ? ' s-' + st.status : '');
  const el = document.getElementById('menu-status');
  if(!st.configured){ el.style.display = 'none'; }
  else {
    el.style.display = '';
    let h = STATUS_TEXT[st.status] || '';
    if(st.message && st.status === 'error') h = st.message;
    if(st.pendingCount) h += ' (' + st.pendingCount.toLocaleString('fa-IR') + ' تغییر در صف)';
    if(st.loggedIn && st.email) h += '<br><b>' + st.email.replace(/[<>&]/g,'') + '</b>';
    if(st.loggedIn && st.lastSyncAt) h += '<br>آخرین همگام‌سازی: ' + fmtAgo(st.lastSyncAt);
    el.innerHTML = h;
  }
  const acc = document.getElementById('set-account');
  if(acc){
    if(!st.configured) acc.textContent = 'اتصال آنلاین هنوز تنظیم نشده (config.js)';
    else if(!st.loggedIn) acc.textContent = 'وارد حساب آنلاین نشدی؛ نوبت‌ها فقط روی همین گوشی ذخیره می‌شن.';
    else acc.innerHTML = 'ایمیل: <b>' + (st.email||'').replace(/[<>&]/g,'') + '</b><br>' + (STATUS_TEXT[st.status]||'') + (st.lastSyncAt ? ' — ' + fmtAgo(st.lastSyncAt) : '');
  }
  document.getElementById('menu-login').classList.toggle('hidden', !st.configured || st.loggedIn);
  document.getElementById('menu-sync').classList.toggle('hidden', !st.loggedIn);
  document.getElementById('menu-logout').classList.toggle('hidden', !st.loggedIn);
}
